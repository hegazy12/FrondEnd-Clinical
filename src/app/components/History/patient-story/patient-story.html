<div class="row">
    <div class="col-md-2 text-center">
        @for (item of Appointments(); track $index)
        {
        <button type="button" class="btn btn-link w-100 text-center" [value]="item.id"
            (click)="changeAppointmentStoryId(item.id)"> {{item.appointmentDate}} </button>
        <br />
        }
    </div>

    <div class="col-md-10">
        <app-appointment-story [AppointmentID]="''"></app-appointment-story>
    </div>
</div>
