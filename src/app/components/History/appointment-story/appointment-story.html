<div class="row">
    <h4> Doctor Name: {{AppointmentDTO3()?.doctorDTO_1?.fristName}} {{AppointmentDTO3()?.doctorDTO_1?.lastName}} {{AppointmentDTO3()?.doctorDTO_1?.specialization}} </h4>
    <div class="row">
        <div class="col-10 d-flex justify-content-end">
                <button 
                type="button" 
                class="btn" 
                [class.btn-danger]="isHistory() === 1" 
                [class.btn-success]="isHistory() !== 1"
                (click)="GitHistory()">
                @if (isHistory() === 0) {
                     Get History
                } @else {
                    Get Recorded 
                }
                </button>
            </div>
    </div>
  
      <div class="row" >
        <h5> Diagnos List </h5>
        <app-list-diagnosos [AppointmentID]="''" [isInHistoryMood]="true" ></app-list-diagnosos>
    </div>
    <div class="row" >
        <h5> Prescription-list </h5>
     <app-prescription-list [AppointmentID]="''" [isInHistoryMood]="true" ></app-prescription-list>
    </div>
    <div class="row" >
        <h5> investgation List </h5>
        <app-list-investgation [AppointmentID]="''" [isInHistoryMood]="true" ></app-list-investgation>
    </div>
    <div>
        <h5> vital List </h5>
        <app-list-vital [AppointmentID]="''" [isInHistoryMood]="true" ></app-list-vital>
    </div>
  
</div>
