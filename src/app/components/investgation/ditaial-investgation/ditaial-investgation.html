@if (isVisible()) {
  <div class="alert-overlay">
    <div class="alert-box">
      <div class="alert-content">
       @for (item of data(); track $index)
       {
           <img  class="image1" [src]="toImageSrc(item.photoBase64)" alt="Examination photo" class="photo-item">
       }
      </div>
      <button class="close-btn" (click)="close()">&times;</button>
    </div>
  </div>
}
