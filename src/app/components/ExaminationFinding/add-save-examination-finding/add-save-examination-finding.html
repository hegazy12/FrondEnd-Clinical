<div class="row" style="margin-right: .5%; margin-left: .5%;">
    <div class="col-md-10" style="margin-top: 1%;">
        <input type="text" class="form-control" #TextsearchTearm placeholder="Search Examination Finding">
    </div>

    <div class="col-md-2 d-flex justify-content-end" style="margin-top: 1%;">
        <input type="button" class="btn btn-primary" value="Search"
            (click)="GetExaminationFindingBySearchTearm(TextsearchTearm.value)">
    </div>

    <div class="col-md-12" style="margin-top: 1%;">
        <select class="form-select" aria-label="Default select example" name="SearchExaminationFinding"
            #ExaminationFinding (change)="onSpecialtyChange($event)">
            <option value="">Please select Examination Finding</option>
            @for (EX of data(); track $index)
            {
            <option [value]="EX.id">{{EX.name}} </option>
            }
        </select>
    </div>

    <div class="col-md-12" style="margin-top: 1%;">
        <textarea class="form-control" rows="3" name="value" #ExaminationFindingvalue
            placeholder="Examination Finding Value"></textarea>
    </div>

    <div class="row" style="margin-top: 1%;">
        <div class="col-12 d-flex justify-content-end">
            <button type="button" class="btn btn-primary" (click)="Create(ExaminationFindingvalue.value)">Save
                Changes</button>
        </div>
    </div>

</div>

<div class="row" style="margin:.5%">
    <app-list-save-examination-finding [AppointmentID]="AppointmentID"
        [isInHistoryMood]="false"></app-list-save-examination-finding>
</div>
