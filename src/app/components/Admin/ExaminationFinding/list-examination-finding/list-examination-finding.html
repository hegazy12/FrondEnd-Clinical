<div class="prescription-table border rounded-top overflow-hidden" style="padding: .5%; margin: .5%;">

    <div class="row g-0 rounded-top" style="background-color: #0d6efd;">
        <div class="col-md-4 text-white fw-semibold p-2">Name</div>
        <div class="col-md-6 text-white fw-semibold p-2">Description</div>
        <div class="col-md-2 text-white fw-semibold p-2">Action</div>
    </div>

    @for (item of data(); track item.id ?? $index)
    {
    <div class="row g-0 table-row">
        <div class="col-md-4 p-2">{{item.name}}</div>
        <div class="col-md-6 p-2">{{item.description}}</div>
        <div class="col-md-2 text-white fw-semibold p-2">
            <button class="btn btn-danger" (click)="DeleteExaminationFinding(item.id)">Delete</button>
        </div>
    </div>
    } @empty {
    <div class="row g-0">
        <div class="col-md-12 text-center text-muted py-4">
            No Examination Finding found.
        </div>
    </div>
    }

</div>
