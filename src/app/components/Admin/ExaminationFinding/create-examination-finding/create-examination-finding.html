<div class="row">
    <div class="row" style="margin-right: .5%; margin-left: .5%;">
        <div class="col-md-10">
            <input type="text" class="form-control" #examinationFindingname placeholder="Add New Examination Finding">
        </div>
        <div class="col-md-12 itemStyel">
            <label class="form-label fw-semibold text-muted small itemStyel">examination Finding description</label>
            <textarea class="form-control" rows="3" name="descriptionName" #descriptionId
                placeholder="Entar examination Finding Body"></textarea>
        </div>

        <div class="row" style="margin-top: 1%;">
            <div class="col-12 d-flex justify-content-end itemStyel">

                <input type="button" class="btn btn-primary" value="Add Examination Finding"
                    (click)="AddExaminationFinding(examinationFindingname.value , descriptionId.value)">
            </div>
        </div>
    </div>
</div>
