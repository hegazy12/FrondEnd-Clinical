<div class="mt-3">
  <h4 class="page-title text-secondary text-center">Main Questions</h4>
  <div class="table-responsive list-card">

    <div class="table-toolbar">
      <input matInput class="form-control searchControl" (keyup)="applyFilter($event)" placeholder="Search">
    </div>

    <table mat-table [dataSource]="dataSource" matSort class="list-table">

      <ng-container matColumnDef="questionBody">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Question</th>
        <td mat-cell *matCellDef="let item">{{ item.questionBody }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
        <td mat-cell *matCellDef="let item">{{ item.description }}</td>
      </ng-container>

      <ng-container matColumnDef="dataTypeName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Data Type</th>
        <td mat-cell *matCellDef="let item">{{ item.dataTypeName }}</td>
      </ng-container>

      <ng-container matColumnDef="values">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Values</th>
        <td mat-cell *matCellDef="let item">{{ valuesText(item) }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header">Actions</th>
        <td mat-cell *matCellDef="let item" class="actions-cell">
          <button class="btn btn-sm btn-outline-danger" (click)="deleteMainQuestion(item.id)">Delete</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data-cell" [attr.colspan]="displayedColumns.length">
          No main questions found.
        </td>
      </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons class="list-paginator"></mat-paginator>
  </div>
</div>
