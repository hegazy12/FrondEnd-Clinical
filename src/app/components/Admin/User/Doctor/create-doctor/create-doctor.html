<form #f="ngForm" (ngSubmit)="onSubmit(f)" novalidate>
    <div class="row g-2">

        <div class="col-md-6">
            <label class="form-label fw-semibold text-muted small" for="userId">User</label>
            <select class="form-select" id="userId" name="userId" [(ngModel)]="userId" #userIdCtrl="ngModel"
                required [class.is-invalid]="userIdCtrl.invalid && userIdCtrl.touched">
                <option value="">Please select a user</option>
                @for (u of users(); track u.id) {
                <option [value]="u.id">{{ u.firstName }} {{ u.lastName }} ({{ u.userName }})</option>
                }
            </select>
            @if (userIdCtrl.invalid && userIdCtrl.touched) {
            <div class="invalid-feedback">Please select a user.</div>
            }
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold text-muted small" for="specialization">Specialization</label>
            <input type="text" class="form-control" id="specialization" name="specialization"
                placeholder="e.g. Obstetrics & Gynecology" [(ngModel)]="specialization"
                #specializationCtrl="ngModel" required
                [class.is-invalid]="specializationCtrl.invalid && specializationCtrl.touched">
            @if (specializationCtrl.invalid && specializationCtrl.touched) {
            <div class="invalid-feedback">Specialization is required.</div>
            }
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold text-muted small" for="clinicName">Clinic Name</label>
            <input type="text" class="form-control" id="clinicName" name="clinicName" placeholder="Clinic name"
                [(ngModel)]="clinicName">
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold text-muted small" for="clinicAddress">Clinic Address</label>
            <input type="text" class="form-control" id="clinicAddress" name="clinicAddress"
                placeholder="Clinic address" [(ngModel)]="clinicAddress">
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold text-muted small" for="clinicPhoneNumber">Clinic Phone</label>
            <input type="tel" class="form-control" id="clinicPhoneNumber" name="clinicPhoneNumber"
                placeholder="Clinic phone number" [(ngModel)]="clinicPhoneNumber">
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold text-muted small" for="clinicEmail">Clinic Email</label>
            <input type="email" class="form-control" id="clinicEmail" name="clinicEmail"
                placeholder="clinic@example.com" [(ngModel)]="clinicEmail" #clinicEmailCtrl="ngModel" email
                [class.is-invalid]="clinicEmailCtrl.invalid && clinicEmailCtrl.touched">
            @if (clinicEmailCtrl.invalid && clinicEmailCtrl.touched) {
            <div class="invalid-feedback">Enter a valid email address.</div>
            }
        </div>

        <div class="col-12 d-flex justify-content-end">
            <button type="submit" class="btn btn-primary px-4" [disabled]="isLoading()">
                {{ isLoading() ? 'Saving...' : 'Add Doctor' }}
            </button>
        </div>

    </div>
</form>
