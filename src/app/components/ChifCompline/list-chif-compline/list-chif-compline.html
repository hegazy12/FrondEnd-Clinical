<div class="diagnosis-table border rounded-top overflow-hidden" style="padding: .5%; margin: .5%;">

    <div class="row g-0 rounded-top" style="background-color: #0d6efd;">
        <div class="col-md-10 text-white fw-semibold p-2"> Chief Complan </div>

        @if(!isInHistoryMood){
        <div class="col-md-2 text-white fw-semibold p-2"> Actions </div>
        }
    </div>

    @for (item of listCheifComplanes(); track $index)
    {
    <div class="row g-0 table-row">
        <div class="col-md-10 p-2">{{ item.text}}</div>

        @if(!isInHistoryMood)
        {
        <div class="col-md-2 p-2">
            <button class="btn btn-sm btn-outline-danger" (click)="DeleteChifComplane(item.id)"> Delete </button>
        </div>
        }
    </div>
    }
    @empty
    {
    <div class="row g-0">
        <div class="col-md-12 text-center text-muted py-4">
            No Chief Complan found.
        </div>
    </div>
    }
</div>
