<app-navbar></app-navbar>

<div class="container-fluid px-4 py-3">
  <div class="border-bottom pb-3 mb-4">
    <div class="row">
      <div class="col-md-10">
        <h2 class="h3 fw-bold text-primary mb-1">
          {{Patient()?.firstName}} {{Patient()?.lastName}}
          <!-- <span class="badge ">{{ appointment()?.patientDTO_1?.gender }} </span> -->
        </h2>
        <p class="text-muted mb-0">
          <span class="me-3"><strong>Gender: </strong> {{ Patient()?.gender }}</span>
          <span class="me-3"><strong>DOB:</strong> {{ Patient()?.dateOfBirth }}</span>
          <span><strong>Phone:</strong> {{ Patient()?.phoneNumber }}</span>
        </p>
      </div>
    </div>
  </div>
</div>






<div class="row g-3 bodyContainer">
  <div class="col-lg-3 col-xl-1">

    <button class="btn btn-primary shadow-sm fixsize" #AddAppintment name="AddAppintment"
      (click)="viewpage(AddAppintment.name)">
      Add Visit
    </button>

    <input type="button" class="btn btn btn-secondary d-flex justify-content-end fixsize" name="viewhistory"
      #viewhistory value="ViewStory" (click)="viewpage(viewhistory.name)">

  </div>


  <div class="col-lg-9 col-xl-11">

    @if( view() == 1 )
    {
    <app-ccreate-appintment [PatientId]="patientId"></app-ccreate-appintment>
    }
    @else if(view() == 2 )
    {
    <app-patient-story #patientstory [PatientID]="patientId"></app-patient-story>
    }
  </div>

</div>-
