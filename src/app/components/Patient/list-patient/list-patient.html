<div class="container mt-4 background">
  <h3 class="mb-4 text-primary">Patients Registry</h3>
  <div class="table-responsive shadow-sm rounded">
    <table class="table table-hover table-striped align-middle mb-0">
      <thead class="table-dark">
        <tr>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Phone Number</th>
          <td>Action</td>
        </tr>
      </thead>
      <tbody>

    @if(isloding())
    {
        @for (patient of Patients(); track $index) {
            <tr>
                <td>{{ patient.fristName }} </td>
                <td>{{ patient.lastName }}</td>
                <td>{{ patient.phone }}</td>
               <td><a [routerLink]="['/Patientview', patient.id]">view</a> </td>
            </tr>
            } 
            @empty
             {
            <tr>
                <td colspan="3" class="text-center text-muted py-4">No patients found.</td>
            </tr>
            }
    }
  

    </tbody>
    </table>
  </div>
</div>
